name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            olab_camera:
              - 'packages/olab_camera/**'
              # olab_camera depends on olab_utils (see the workspace-dependency
              # install step below) — a olab_utils-only change must still run
              # olab_camera's install/test/build job, not just olab_utils's own.
              - 'packages/olab_utils/**'
            olab_utils:
              - 'packages/olab_utils/**'
            olab_rf:
              - 'packages/olab_rf/**'
            olab_voice:
              - 'packages/olab_voice/**'
            olab_audio:
              - 'packages/olab_audio/**'
            olab_playground:
              - 'packages/olab_playground/**'
              # olab_playground depends on olab_camera (which itself depends
              # on olab_utils) — same workspace-dependency reasoning as
              # olab_camera's filter above.
              - 'packages/olab_camera/**'
              - 'packages/olab_utils/**'

  test:
    needs: detect-changes
    if: needs.detect-changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJSON(needs.detect-changes.outputs.packages) }}
        python-version: ["3.10", "3.11"]
        exclude:
          # olab-rf's requires-python floor is >=3.11, not >=3.10.
          - package: olab_rf
            python-version: "3.10"
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # olab_audio's base dependencies (pyaudio, pulsectl) are intentionally
      # core, not an opt-in extra — the plan's v1 scope treats device I/O as
      # the default install; only the DSP/teaching toolkit (`analysis`) is
      # opt-in. pyaudio needs PortAudio's headers to build on Ubuntu.
      - name: Install system prerequisites for olab_audio
        if: matrix.package == 'olab_audio'
        run: sudo apt-get update && sudo apt-get install -y portaudio19-dev
      # pyzbar (addBarcode() / addQR(decoder='pyzbar')) is olab_camera's
      # opt-in `barcode` extra, and it only wraps the native ZBar library --
      # it needs libzbar0 at runtime, or importing it raises "Unable to find
      # zbar shared library". It's tiny, so olab_camera's job installs the
      # extra (see below) to keep the pyzbar tests running instead of skipping.
      - name: Install system prerequisites for olab_camera
        if: matrix.package == 'olab_camera'
        run: sudo apt-get update && sudo apt-get install -y libzbar0
      # olab_camera depends on olab_utils (a workspace-internal package) —
      # install it from its local path first, rather than resolving it from
      # PyPI, so CI exercises the dependency's *current* working-tree state
      # (including an uncommitted/unreleased change), not whatever's already
      # published.
      - name: Install olab_utils (olab_camera's workspace dependency)
        if: matrix.package == 'olab_camera' || matrix.package == 'olab_playground'
        run: pip install "./packages/olab_utils"
      # olab_playground depends on olab_camera — same reasoning as above,
      # installed after olab_utils so olab_camera's own install can find it.
      - name: Install olab_camera (olab_playground's workspace dependency)
        if: matrix.package == 'olab_playground'
        run: pip install "./packages/olab_camera"
      - name: Install package (base dependencies only)
        run: |
          python -m pip install --upgrade pip
          pip install "./packages/${{ matrix.package }}"
          pip install pytest
      - name: Install olab_camera's barcode extra (pyzbar)
        if: matrix.package == 'olab_camera'
        run: pip install "./packages/olab_camera[barcode]"
      # Only base-dependency tests run here, deliberately — hardware/model
      # *extras* (ROS, STT/TTS models, etc.) are opt-in per CONTRIBUTING.md's
      # Testing section and must not be installed on every PR. Packages
      # needing extra-specific CI coverage add a separate, explicitly
      # opt-in job rather than expanding this one.
      - name: Run tests
        run: pytest "packages/${{ matrix.package }}/tests" -v
      - name: Build wheel and sdist
        run: |
          pip install build
          python -m build "packages/${{ matrix.package }}"
