[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "olab-camera"
version = "0.1.0"
description = "Camera capture, local recording, and network streaming (MJPEG/WebSocket/WebRTC) for lab robotics projects."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Optimator Lab" }]
dependencies = [
    "olab-utils>=0.2.0",
    "numpy>=1.21.0",
    "opencv-python>=4.10.0",
    # TLS is not optional: every streaming mode (including the MJPEG
    # default) serves over HTTPS/WSS. cryptography auto-generates a local
    # self-signed cert on first use (see olab_camera.tls) instead of
    # shipping a shared private key as package data.
    "cryptography>=42",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Homepage = "https://github.com/optimatorlab/olab_code/tree/main/packages/olab_camera"
Source = "https://github.com/optimatorlab/olab_code/tree/main/packages/olab_camera"
Issues = "https://github.com/optimatorlab/olab_code/issues"
Changelog = "https://github.com/optimatorlab/olab_code/blob/main/packages/olab_camera/CHANGELOG.md"

[project.optional-dependencies]
# Extras carried over from ub_code's existing, already-proven convention.
yolo = ["ultralytics>=8.3.0"]
tracking = ["trackers==2.6.0"]
rfdetr = ["rfdetr==1.9.0", "trackers==2.6.0"]
websocket = ["websockets>=12.0"]
webrtc = ["aiortc>=1.9.0", "aiohttp>=3.9.0"]
realsense = ["pyrealsense2>=2.55"]
# addBarcode() and addQR(decoder='pyzbar'). pyzbar only wraps the ZBar C
# library: its Windows wheels bundle it, but on Linux/Raspberry Pi/macOS it
# also needs the system package (libzbar0 / `brew install zbar`), which pip
# can't install -- so it's opt-in rather than a half-working base dependency.
# addQR()'s default decoder='cv2' needs neither.
barcode = ["pyzbar>=0.1.9"]
# openmv itself only requires Python >=3.8 (confirmed against the published
# 1.0.7 wheel metadata) -- it follows the base package's own >=3.10 floor,
# no separate/stricter version requirement.
#
# Pinned exactly to 1.0.7: it is the only PyPI release and the version the
# GENX320 frame/format handling in camera_openmv.py is validated against. An
# unbounded `>=1.0.7` would let a future breaking release install silently.
# NOTE: the installed 1.0.7 package's internal `openmv.__version__` string
# erroneously reports "2.0.0" -- trust `pip show openmv` (the dist metadata),
# not that attribute.
openmv = ["openmv==1.0.7"]
# AVWebcam composes a CameraUSB with an olab_audio.Mic -- olab_camera does
# not depend on olab_audio otherwise, so this stays an extra, guarded the
# same way as the others (see av_webcam.py's try/except import).
av = ["olab-audio>=0.1.0"]
all = ["olab-camera[yolo,tracking,rfdetr,websocket,webrtc,realsense,barcode,openmv,av]"]

[project.scripts]
olab-camera-generate-cert = "olab_camera.tls:generate_cert_main"
olab-camera-generate-ca = "olab_camera.ca:generate_ca_main"
olab-camera-issue-cert = "olab_camera.ca:issue_cert_main"

[tool.hatch.build.targets.wheel]
packages = ["src/olab_camera"]

[tool.pytest.ini_options]
# First custom pytest marker in this repo (no sibling package registers one
# yet). CI runs plain `pytest packages/olab_camera/tests -v` with no `-m`
# filter (see .github/workflows/ci.yml), so `addopts` is what actually
# excludes "slow" (clean-install/wheel-build) tests by default -- run them
# explicitly with `pytest -m slow`.
markers = [
    "slow: clean-install/wheel-build tests excluded from the default run",
]
addopts = "-m 'not slow'"
